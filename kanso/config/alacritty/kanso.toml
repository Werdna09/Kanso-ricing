# Kanso — terminal; full config installed only when explicitly applying the theme.
[general]
live_config_reload = true
ipc_socket = true

[window]
decorations = "Full"
opacity = 0.96
blur = false
padding = { x = 14, y = 11 }
dynamic_padding = false

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }

[cursor]
style = { shape = "Beam", blinking = "Off" }

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[colors.primary]
background = "#1D3D46"
foreground = "#F7E9C9"
dim_foreground = "#A4BAB4"

[colors.cursor]
text = "#1D3D46"
cursor = "#D5CFAD"

[colors.vi_mode_cursor]
text = "#1D3D46"
cursor = "#F7E9C9"

[colors.selection]
text = "#FDECC7"
background = "#41636B"

[colors.normal]
black = "#233941"
red = "#CF958B"
green = "#A7C1A5"
yellow = "#DDC99B"
blue = "#A5BCC8"
magenta = "#C7B3CA"
cyan = "#92C3C1"
white = "#F7E9C9"

[colors.bright]
black = "#667F80"
red = "#E6AAA3"
green = "#BDD1B2"
yellow = "#F2DCAB"
blue = "#B8CFDD"
magenta = "#D8C7DD"
cyan = "#B3D5D3"
white = "#FFF5DF"
